name: ARRCC hourly health checks

on:
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:
  pull_request:
    branches: ["main"]
    paths:
      - "web/**"
      - "tests/**"
      - ".github/workflows/health-check.yml"
  push:
    branches: ["main"]
    paths:
      - "web/**"
      - "tests/**"
      - ".github/workflows/health-check.yml"

permissions:
  contents: read

concurrency:
  group: arrcc-hourly-health-checks
  cancel-in-progress: true

jobs:
  static-health-checks:
    name: Static integrity and regression checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run ARRCC integrity checks
        id: checks
        run: python tests/healthcheck.py

      - name: Install Playwright browser test dependencies
        run: |
          python -m pip install "playwright>=1.55,<2.0"
          python -m playwright install --with-deps chromium firefox webkit

      - name: Run desktop and mobile browser smoke tests
        id: browser
        run: python tests/browser_smoke.py

      - name: Check published GitHub Pages endpoint
        id: live
        run: |
          python - <<'PY'
          import urllib.request
          url = "https://gudjencio.github.io/arrcc/"
          request = urllib.request.Request(url, headers={"User-Agent": "ARRCC-HealthCheck/1.0"})
          with urllib.request.urlopen(request, timeout=20) as response:
              body = response.read(2_000_000).decode("utf-8", "replace")
              if response.status != 200:
                  raise SystemExit(f"Unexpected HTTP status: {response.status}")
              if 'id="map"' not in body or 'id="sosButton"' not in body:
                  raise SystemExit("Published page is missing critical map or emergency interface markers")
              print(f"PASS: {url} returned HTTP {response.status}; critical interface markers found.")
          PY

      - name: Write health report
        if: always()
        run: |
          mkdir -p health-reports
          {
            echo "# ARRCC hourly health report"
            echo
            echo "- Run: ${GITHUB_RUN_NUMBER}"
            echo "- Commit: ${GITHUB_SHA}"
            echo "- UTC: $(date -u +'%Y-%m-%d %H:%M:%S')"
            echo "- Static checks: ${{ steps.checks.outcome }}"
            echo "- Browser checks (Chromium, Firefox, WebKit; desktop/mobile): ${{ steps.browser.outcome }}"
            echo "- Published site check: ${{ steps.live.outcome }}"
            echo
            echo "This workflow is diagnostic only. It never edits or deploys application files."
            echo "Detected failures require investigation and a reviewed pull request before publication."
          } | tee health-reports/report.md
          cat health-reports/report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload health report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arrcc-health-report-${{ github.run_number }}
          path: health-reports/report.md
          if-no-files-found: warn
          retention-days: 30
